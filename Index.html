<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Império da Sorte</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030503;color:#fff;font-family:Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:15px}.top{text-align:center;padding:15px}
.logo{font-size:28px;font-weight:900}.logo span{display:block;color:#63ff00;font-size:15px;letter-spacing:5px}
.card{background:#0a100a;border:1px solid #63ff0055;border-radius:20px;padding:16px}
h1{margin:0}.sub{color:#9ca69d;margin:7px 0 15px}
.stats{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#050805;padding:10px;border-radius:12px}.stat b{display:block;color:#63ff00;font-size:23px}
.controls{display:flex;gap:8px;margin:15px 0}.controls input{flex:1;background:#050705;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:13px}.controls button,.draw{background:#0c170b;color:#63ff00;border:1px solid #63ff0066;border-radius:10px;padding:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.n{height:58px;background:#091208;color:#fff;border:1px solid #63ff00;border-radius:8px;font-weight:bold}.r{background:#280909;border-color:#f33;color:#ff7777}
.n small{display:block;font-size:8px;overflow:hidden;white-space:nowrap}.pages{text-align:center;margin:15px}.pages button{margin:3px;padding:8px 11px;background:#101510;color:#fff;border:1px solid #ffffff22;border-radius:7px}.pages .on{color:#63ff00;border-color:#63ff00}
.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px}.box{background:#0a100a;border:1px solid #63ff00;border-radius:18px;padding:20px;width:min(420px,100%)}.box input{width:100%;padding:13px;margin:6px 0;background:#050705;color:#fff;border:1px solid #ffffff22;border-radius:9px}.ok{width:100%;padding:13px;background:#63ff00;border:0;border-radius:9px;font-weight:bold;margin-top:8px}.cancel{width:100%;padding:12px;background:#222;color:#fff;border:0;border-radius:9px;margin-top:7px}
@media(max-width:700px){.grid{grid-template-columns:repeat(5,1fr)}.n{height:55px}.controls{display:block}.controls button{width:100%;margin-top:7px}}
</style>
</head>
<body>
<main>
<div class="top">
<div class="logo">♛ IMPÉRIO <span>DA SORTE</span></div>
</div>

<div class="card">
<h1>🔥 Kit Churrasco</h1>
<div class="sub">2.600 números • R$ 2,50 cada</div>

<div class="stats">
<div class="stat"><b id="t">2600</b>Total</div>
<div class="stat"><b id="r">0</b>Reservados</div>
<div class="stat"><b id="a">2600</b>Disponíveis</div>
</div>

<div class="controls">
<input id="search" placeholder="🔎 Buscar número ou nome">
<button onclick="load()">↻ Atualizar</button>
</div>

<div id="pages" class="pages"></div>
<div id="grid" class="grid"></div>

<p style="text-align:center;color:#777;font-size:11px">
Valor máximo se todos os números forem vendidos: R$ 6.500,00
</p>
</div>
</main>

<div id="modal" class="modal">
<div class="box">
<h2>Reservar número <span id="num"></span></h2>
<input id="name" placeholder="Nome completo">
<input id="phone" placeholder="WhatsApp">
<p id="msg" style="color:#ff7777"></p>
<button class="ok" onclick="reserve()">CONFIRMAR RESERVA</button>
<button class="cancel" onclick="closeModal()">CANCELAR</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://xisumqhkmxdivaogdtaa.supabase.co";
const KEY="sb_publishable_YdiwdHFjHZdkgcijNmFSNw_C1112iwk";
const KIT="26000000-0000-0000-0000-000000000260";
const TOTAL=2600,PER=100;
const db=supabase.createClient(URL,KEY);
let rows=[],selected=0,page=1;

async function load(){
 const {data,error}=await db.from("public_number_status")
 .select("number,name").eq("kit_id",KIT).order("number");
 if(error){alert(error.message);return}
 rows=data||[];
 document.getElementById("r").textContent=rows.filter(x=>x.name).length;
 document.getElementById("a").textContent=TOTAL-rows.filter(x=>x.name).length;
 render();
}

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 let nums=[];
 for(let i=1;i<=TOTAL;i++){
  let x=rows.find(r=>r.number===i);
  let s=String(i).padStart(4,"0");
  if(!q||s.includes(q)||(x?.name||"").toLowerCase().includes(q))nums.push(i);
 }
 let max=Math.max(1,Math.ceil(nums.length/PER));
 if(page>max)page=max;
 let list=nums.slice((page-1)*PER,page*PER);
 let g=document.getElementById("grid");g.innerHTML="";
 list.forEach(i=>{
  let x=rows.find(r=>r.number===i);
  let b=document.createElement("button");
  b.className="n"+(x?" r":"");
  b.innerHTML=String(i).padStart(4,"0")+(x?"<small>"+safe(x.name)+"</small>":"");
  if(!x)b.onclick=()=>openModal(i);
  g.appendChild(b);
 });
 let p=document.getElementById("pages");p.innerHTML="";
 for(let i=1;i<=max;i++){
  if(i<=3||i>max-3||Math.abs(i-page)<=1){
   let b=document.createElement("button");
   b.textContent=i;b.className=i===page?"on":"";
   b.onclick=()=>{page=i;render()};p.appendChild(b);
  }
 }
}

function safe(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openModal(n){selected=n;document.getElementById("num").textContent="#"+String(n).padStart(4,"0");document.getElementById("modal").style.display="flex";document.getElementById("name").focus()}
function closeModal(){document.getElementById("modal").style.display="none";document.getElementById("msg").textContent=""}

async function reserve(){
 let name=document.getElementById("name").value.trim();
 let phone=document.getElementById("phone").value.trim();
 if(name.length<2){document.getElementById("msg").textContent="Digite o nome completo.";return}
 let {error}=await db.rpc("reserve_number",{p_kit_id:KIT,p_number:selected,p_name:name,p_phone:phone});
 if(error){document.getElementById("msg").textContent=error.message;return}
 closeModal();await load();
}

document.getElementById("search").oninput=()=>{page=1;render()};
load();
</script>
</body>
</html>
